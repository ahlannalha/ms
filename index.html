<?xml version="1.0" encoding="UTF-8" ?>
<html expr:dir='data:blog.languageDirection' xmlns='http://www.w3.org/1999/xhtml' xmlns:b='http://www.google.com/2005/gml/b' xmlns:data='http://www.google.com/2005/gml/data' xmlns:expr='http://www.google.com/2005/gml/expr'>
<head>
    <meta charset='UTF-8'/>
    <meta content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no' name='viewport'/>
    <title><data:blog.pageTitle/></title>
    
    <b:skin><![CDATA[
        /* Reset & Fullscreen Apps Script Wrapper Theme */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8f9fa;
        }
        .app-frame-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        iframe.app-embed {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        /* Fallback / Loading state */
        .loading-notice {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #6c757d;
            font-size: 14px;
            z-index: -1;
            text-align: center;
        }
    ]]></b:skin>
</head>
<body>
    <div class='loading-notice' style='text-align: center; padding: 20px; color: #666; font-family: sans-serif;'>
        Memuat aplikasi Mushollah Baiturrahim...
    </div>

    <div class='app-frame-container' id='user-view' style='width: 100%; height: 100%; position: absolute; top: 0; left: 0;'>
        <iframe allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture' allowfullscreen='true' class='app-embed' src='https://script.google.com/macros/s/AKfycbzkPK-u-uyJt0MyspbDeAClvpuuIiIlmBx-u3VqIN2q9tbPqajvpwPWohl3CqR-sday/exec'>
        </iframe>
    </div>

    <div style='text-align: center; margin: 20px;'>
  <a href='https://script.google.com/macros/s/AKfycbxxPHtHlQkQg1KFwi6G4q60x1ICW80wM8ygbUEcZmvd7UenoTMoTlWupRBxZ0KEteVT/exec?page=admin' style=' color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; font-weight: bold;' target='_blank'>
  
  </a>
</div>

    <div style='display:none;'>
        <b:section id='hidden-section' showaddelement='false'/>
    </div>
    <script>
    //<![CDATA[
        // Otomatis mendeteksi jika URL mengandung parameter ?page=admin
        window.addEventListener('DOMContentLoaded', (event) => {
            const urlParams = new URLSearchParams(window.location.search);
            const page = urlParams.get('page');
            
            if (page === 'admin') {
                document.getElementById('user-view').style.display = 'none';
                document.getElementById('admin-view').style.display = 'block';
            } else {
                document.getElementById('user-view').style.display = 'block';
                document.getElementById('admin-view').style.display = 'none';
            }
        });
    //]]>
    </script>
</body>
</html>
